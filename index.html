<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth0 Login Flow | Secure Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#12102a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
        .container{max-width:480px;width:100%;padding:20px}
        .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(99,93,255,0.3);border-radius:24px;padding:48px 40px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.4)}
        .logo{font-size:3rem;margin-bottom:16px}
        h1{font-size:1.8rem;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#635dff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{color:#888;font-size:0.95rem;margin-bottom:36px;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:all 0.3s;width:100%;justify-content:center;margin-bottom:12px}
        .btn-primary{background:linear-gradient(135deg,#635dff,#4f3fff);color:white}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,93,255,0.5)}
        .feature-list{text-align:left;margin-bottom:28px}
        .feature-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:0.9rem;color:#999;border-bottom:1px solid rgba(255,255,255,0.05)}
        .feature-item:last-child{border-bottom:none}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">🔐</div>
        <h1>Auth0 Login Flow</h1>
        <p class="subtitle">Secure authentication powered by Auth0 - industry-standard identity platform</p>
        <div class="feature-list">
            <div class="feature-item"><span>✅</span> OAuth 2.0 / OpenID Connect</div>
            <div class="feature-item"><span>🛡️</span> Universal Login Page</div>
            <div class="feature-item"><span>🔑</span> JWT Token Authentication</div>
            <div class="feature-item"><span>🌐</span> Social Login Support</div>
        </div>
        <button class="btn btn-primary">Sign In with Auth0</button>
        <p style="color:#555;font-size:0.75rem;margin-top:24px">Built for MLH Global Hack Week GenAI 2025</p>
    </div>
</div>
</body>
</html>
