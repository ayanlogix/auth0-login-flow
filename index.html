<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth0 Flow | Ayan Hussain</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Plus Jakarta Sans',sans-serif;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
        .card{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);padding:40px;border-radius:24px;width:100%;max-width:400px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.5)}
        h1{font-size:1.8rem;margin-bottom:10px;background:linear-gradient(to right, #00d2ff, #3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        p{color:#888;font-size:0.9rem;margin-bottom:30px}
        .btn{background:linear-gradient(to right, #00d2ff, #3a7bd5);color:#000;border:none;padding:14px;width:100%;border-radius:12px;font-weight:700;cursor:pointer;transition:0.3s}
        .btn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,210,255,0.3)}
        .features{text-align:left;margin-bottom:20px;font-size:0.8rem;color:#666}
        .feature{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    </style>
</head>
<body>
<div class="card">
    <div style="font-size:3rem;margin-bottom:20px">🔐</div>
    <h1>Auth0 Login Flow</h1>
    <p>Secure identity management for MLH Hack Week 2025</p>
    <div class="features">
        <div class="feature">✅ OAuth 2.0 / OpenID Connect</div>
        <div class="feature">✅ JWT Session Management</div>
        <div class="feature">✅ Fine-Grained Access Control</div>
    </div>
    <button class="btn">Sign In with Auth0</button>
</div>
</body>
</html>
