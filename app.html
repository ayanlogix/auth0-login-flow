<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth0 Login Flow | Secure Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#12102a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
        .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(99,93,255,0.3);border-radius:24px;padding:48px 40px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.4)}
        h1{font-size:1.8rem;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#635dff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{color:#888;font-size:0.95rem;margin-bottom:36px}
        .btn-primary{background:linear-gradient(135deg,#635dff,#4f3fff);color:white;padding:14px;width:100%;border-radius:12px;font-weight:600;border:none;cursor:pointer}
        .feature-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:0.9rem;color:#999;border-bottom:1px solid rgba(255,255,255,0.05);text-align:left}
    </style>
</head>
<body>
<div class="card">
    <div style="font-size:3rem;margin-bottom:16px">🔐</div>
    <h1>Auth0 Login Flow</h1>
    <p class="subtitle">Secure authentication powered by Auth0</p>
    <div style="margin-bottom:28px">
        <div class="feature-item"><span>✅</span> OAuth 2.0 / OpenID Connect</div>
        <div class="feature-item"><span>🛡️</span> Universal Login Page</div>
        <div class="feature-item"><span>🔑</span> JWT Token Authentication</div>
    </div>
    <button class="btn-primary">Sign In with Auth0</button>
</div>
</body>
</html>
